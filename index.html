<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrasi ASAJ - SMPN 4 Majenang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .header-bg {
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://i.postimg.cc/s22dbd0K/sekolah.jpg');
            background-size: cover;
            background-position: center;
            background-color: #1e3a8a;
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #2563eb;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-100 min-h-screen py-0 md:py-10">

    <div class="max-w-4xl mx-auto bg-white shadow-2xl overflow-hidden md:rounded-3xl min-h-screen md:min-h-0 border-t-8 border-blue-600">
        
        <!-- Header -->
        <div class="header-bg py-16 px-8 flex flex-col items-center justify-center text-center text-white relative">
            <div class="absolute top-4 right-6 bg-white/20 backdrop-blur-md px-3 py-1 rounded-full text-xs font-medium">
                TP 2025/2026
            </div>
            <h1 class="text-3xl md:text-4xl font-extrabold uppercase tracking-widest mb-2 text-yellow-400">Administrasi ASAJ</h1>
            <div class="h-1.5 w-24 bg-white rounded-full mb-4"></div>
            <p class="text-xl md:text-2xl font-bold tracking-tight">SMP NEGERI 4 MAJENANG</p>
        </div>

        <div class="p-8 md:p-12">
            <form id="attendanceForm" class="space-y-8">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-8">
                    
                    <!-- Tanggal Pelaksanaan -->
                    <div class="flex flex-col">
                        <label class="flex items-center text-lg font-extrabold text-blue-700 mb-2 tracking-tight">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            Tanggal Pelaksanaan
                        </label>
                        <input type="date" id="tanggal" name="tanggal" required
                            class="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-xl focus:ring-4 focus:ring-blue-100 focus:border-blue-600 focus:outline-none transition-all font-semibold text-slate-800">
                    </div>

                    <!-- Mata Pelajaran -->
                    <div class="flex flex-col">
                        <label class="flex items-center text-lg font-extrabold text-blue-700 mb-2 tracking-tight">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                            Mata Pelajaran
                        </label>
                        <select id="mapel" name="mapel" required
                            class="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-xl focus:ring-4 focus:ring-blue-100 focus:border-blue-600 focus:outline-none transition-all font-semibold text-slate-800 cursor-pointer">
                            <option value="">Pilih Mata Pelajaran</option>
                            <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                            <option value="Bahasa Inggris">Bahasa Inggris</option>
                            <option value="Bahasa Jawa">Bahasa Jawa</option>
                            <option value="Ilmu Pengetahuan Alam">Ilmu Pengetahuan Alam</option>
                            <option value="Ilmu Pengetahuan Sosial">Ilmu Pengetahuan Sosial</option>
                            <option value="Informatika">Informatika</option>
                            <option value="Matematika">Matematika</option>
                            <option value="Pendidikan Agama & Budi Pekerti">Pendidikan Agama & Budi Pekerti</option>
                            <option value="Pendidikan Pancasila">Pendidikan Pancasila</option>
                            <option value="Penjasorkes">Penjasorkes</option>
                            <option value="Seni Budaya">Seni Budaya</option>
                        </select>
                    </div>

                    <!-- Sesi -->
                    <div class="flex flex-col">
                        <label class="flex items-center text-lg font-extrabold text-blue-700 mb-2 tracking-tight">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Sesi
                        </label>
                        <select id="sesi" name="sesi" required
                            class="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-xl focus:ring-4 focus:ring-blue-100 focus:border-blue-600 focus:outline-none transition-all font-semibold text-slate-800 cursor-pointer">
                            <option value="">Pilih Sesi</option>
                            <option value="1">Sesi 1</option>
                            <option value="2">Sesi 2</option>
                        </select>
                    </div>

                    <!-- Ruang -->
                    <div class="flex flex-col">
                        <label class="flex items-center text-lg font-extrabold text-blue-700 mb-2 tracking-tight">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m4 0h1m-5 10h1m4 0h1m-5-4h1m4 0h1"></path></svg>
                            Ruang
                        </label>
                        <select id="ruang" name="ruang" required
                            class="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-xl focus:ring-4 focus:ring-blue-100 focus:border-blue-600 focus:outline-none transition-all font-semibold text-slate-800 cursor-pointer">
                            <option value="">Memuat data...</option>
                        </select>
                    </div>

                    <!-- Keterangan -->
                    <div class="flex flex-col">
                        <label class="flex items-center text-lg font-extrabold text-blue-700 mb-2 tracking-tight">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Keterangan
                        </label>
                        <select id="keterangan" name="keterangan" required
                            class="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-xl focus:ring-4 focus:ring-blue-100 focus:border-blue-600 focus:outline-none transition-all font-bold text-red-600 cursor-pointer">
                            <option value="">Pilih Keterangan</option>
                            <option value="Sakit">Sakit</option>
                            <option value="Ijin">Ijin</option>
                            <option value="Tanpa Keterangan">Tanpa Keterangan</option>
                            <option value="Sebab Lainnya">Sebab Lainnya</option>
                        </select>
                    </div>

                    <!-- Nama Murid -->
                    <div class="flex flex-col md:col-span-2">
                        <label class="flex items-center text-lg font-extrabold text-blue-700 mb-2 tracking-tight">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            Nama Murid
                        </label>
                        <select id="nama" name="nama" required disabled
                            class="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-xl focus:ring-4 focus:ring-blue-100 focus:border-blue-600 focus:outline-none transition-all font-semibold text-slate-800 disabled:opacity-50 cursor-pointer">
                            <option value="">Pilih Ruang Dahulu</option>
                        </select>
                    </div>

                    <!-- Kelas -->
                    <div class="flex flex-col md:col-span-2">
                        <label class="flex items-center text-lg font-extrabold text-blue-700 mb-2 tracking-tight">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                            Kelas
                        </label>
                        <select id="kelas" name="kelas" required disabled
                            class="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-xl focus:ring-4 focus:ring-blue-100 focus:border-blue-600 focus:outline-none transition-all font-semibold text-slate-800 disabled:opacity-50 cursor-pointer">
                            <option value="">Pilih Ruang Dahulu</option>
                        </select>
                    </div>

                </div>

                <div id="statusMessage" class="hidden text-center p-5 rounded-2xl text-base font-bold animate-pulse"></div>

                <div class="pt-6">
                    <button type="submit" id="submitBtn"
                        class="w-full bg-blue-700 hover:bg-blue-800 text-white font-black py-5 rounded-2xl shadow-2xl shadow-blue-200 transform active:scale-[0.97] transition-all duration-200 text-xl uppercase tracking-widest">
                        SIMPAN DATA SEKARANG
                    </button>
                </div>
            </form>
        </div>

        <footer class="bg-slate-50 py-10 text-center border-t-2 border-slate-100">
            <p class="text-blue-900 text-base font-extrabold">ADMINISTRASI ASESMEN</p>
            <p class="text-slate-500 text-sm mt-1 font-bold tracking-widest uppercase">SMP NEGERI 4 MAJENANG</p>
        </footer>
    </div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRHraHt7LjGQyrnZs5MVaYm3SlcKnkxAvLFx_uZkz2dPhBFQwtuNMNEsOApTyd2DltHrVBxWOVCtJfC/pub?output=csv';
        const scriptUrl = 'https://script.google.com/macros/s/AKfycbzDku8ZT8Gnb7Zm39KEIpp1cl7heZFeFTL4F2J74qX--cEzh42bcRQApxpieKxTp8Hj/exec'; 

        let masterData = [];

        async function fetchData() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                const rows = data.split('\n').map(row => row.split(','));
                
                const jsonData = rows.slice(1).map(row => ({
                    nama: row[2]?.replace(/"/g, '').trim(),
                    kelas: row[3]?.replace(/"/g, '').trim(),
                    ruang: row[6]?.replace(/"/g, '').trim()
                })).filter(item => item.ruang && item.nama);

                masterData = jsonData;
                populateRuang();
            } catch (error) {
                console.error('Fetch Error:', error);
                document.getElementById('ruang').innerHTML = '<option value="">Gagal memuat data sumber</option>';
            }
        }

        function populateRuang() {
            const ruangSelect = document.getElementById('ruang');
            // Menggunakan localeCompare dengan numeric: true agar urutan 1, 2, 10 benar
            const uniqueRuang = [...new Set(masterData.map(item => item.ruang))].sort((a, b) => 
                a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' })
            );
            
            ruangSelect.innerHTML = '<option value="">Pilih Ruang</option>';
            uniqueRuang.forEach(r => {
                const opt = document.createElement('option');
                opt.value = r;
                opt.textContent = r;
                ruangSelect.appendChild(opt);
            });
        }

        document.getElementById('ruang').addEventListener('change', function() {
            const selectedRuang = this.value;
            const namaSelect = document.getElementById('nama');
            const kelasSelect = document.getElementById('kelas');

            if (!selectedRuang) {
                namaSelect.innerHTML = '<option value="">Pilih Ruang Dahulu</option>';
                kelasSelect.innerHTML = '<option value="">Pilih Ruang Dahulu</option>';
                namaSelect.disabled = true;
                kelasSelect.disabled = true;
                return;
            }

            const filtered = masterData.filter(item => item.ruang === selectedRuang);
            
            namaSelect.innerHTML = '<option value="">Pilih Nama</option>';
            filtered.sort((a,b) => a.nama.localeCompare(b.nama)).forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.nama;
                opt.textContent = item.nama;
                namaSelect.appendChild(opt);
            });
            namaSelect.disabled = false;

            // Pengurutan kelas secara numerik (misal: 7A, 7B, 8A, 10A)
            const uniqueKelas = [...new Set(filtered.map(item => item.kelas))].sort((a, b) => 
                a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' })
            );

            kelasSelect.innerHTML = '<option value="">Pilih Kelas</option>';
            uniqueKelas.forEach(k => {
                const opt = document.createElement('option');
                opt.value = k;
                opt.textContent = k;
                kelasSelect.appendChild(opt);
            });
            kelasSelect.disabled = false;
        });

        document.getElementById('attendanceForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('statusMessage');
            
            btn.disabled = true;
            btn.innerHTML = '<span class="loader mr-3"></span> PROSES MENYIMPAN...';
            
            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch(scriptUrl, {
                    method: 'POST',
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                
                status.className = 'p-5 rounded-2xl text-base font-bold bg-green-100 text-green-800 block border-2 border-green-200';
                status.textContent = '✓ BERHASIL: Data administrasi telah berhasil disimpan.';
                
                this.reset();
                document.getElementById('nama').disabled = true;
                document.getElementById('kelas').disabled = true;
            } catch (error) {
                status.className = 'p-5 rounded-2xl text-base font-bold bg-amber-100 text-amber-800 block border-2 border-amber-200';
                status.textContent = 'Pesan: Form Aktif. Pastikan URL Script Apps Script sudah dipasang untuk menyimpan data.';
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'SIMPAN DATA SEKARANG';
                setTimeout(() => { status.classList.add('hidden'); }, 8000);
            }
        });

        window.onload = fetchData;
    </script>
</body>
</html>
